server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # v1.7.5: jméno 'api' překládat za běhu (Docker DNS), ne jednou při startu — po --force-recreate api
    # dostane kontejner novou IP a nginx by dál posílal na starou (lekce 1. 11.: „přihlášení selhalo“).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_up http://api:8000;

    # SPA: neznámé cesty servíruj přes index.html (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html se nikdy necachuje → appka/prohlížeč vždy načte aktuální verzi
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # hashované assety (mají v názvu hash) se mohou cachovat natrvalo
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # WebSockety (servisní konzole boxu): nginx upgrade NEPROPOUŠTÍ defaultně (lekce 9. 9.)
    location ~ ^/api/(emsboxes/[0-9]+/console/ws|ingest/v1/console/) {
        proxy_pass $api_up;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;   # konzole smí být tichá; idle řeší server (15 min)
        proxy_send_timeout 1800s;
    }

    # API proxy -> kontejner 'api'
    location /api/ {
        proxy_pass $api_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # v1.2.3: dávka telemetrie z bufferu EMSBOXu (1000 ř. × 60 veličin ≈ 2 MB) narážela na výchozí 1 MB → 413
        client_max_body_size 16m;
    }
}
